
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030806"/>
      <stop offset="50%" stop-color="#07110c"/>
      <stop offset="100%" stop-color="#020504"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39ff88"/>
      <stop offset="100%" stop-color="#00b85a"/>
    </linearGradient>
    <linearGradient id="darkgreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2117"/>
      <stop offset="100%" stop-color="#07110c"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00ff66" flood-opacity=".10"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#39ff88" stroke-opacity=".035"/>
    </pattern>
    <style>
      .title{font:700 25px Inter,Segoe UI,Arial,sans-serif;fill:#eafff1}
      .sub{font:500 14px Inter,Segoe UI,Arial,sans-serif;fill:#82a992}
      .small{font:600 10px Inter,Segoe UI,Arial,sans-serif;fill:#3fae6b;letter-spacing:3px}
      .card{fill:url(#darkgreen);fill-opacity:.94;stroke:#163b28;stroke-width:1.5}
      .line{fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="560" rx="28" fill="url(#grid)"/>
  <circle cx="600" cy="280" r="300" fill="#00ff66" opacity=".025"/>

  <text x="600" y="52" text-anchor="middle" class="small">SYSTEM / SECURITY / INFRA</text>
  <text x="600" y="84" text-anchor="middle" class="title" font-size="30">Skills &amp; Tools</text>
  <path d="M500 101H700" stroke="#39ff88" stroke-opacity=".35"/>

  <!-- Linux -->
  <g filter="url(#shadow)">
    <rect x="42" y="120" width="350" height="175" rx="18" class="card"/>
    <rect x="42" y="120" width="350" height="3" rx="1.5" fill="url(#neon)" filter="url(#glow)"/>
  </g>
  <g transform="translate(75 150)">
    <circle cx="38" cy="38" r="31" fill="#071b10" stroke="#247b49"/>
    <path d="M38 17c-10 0-18 8-18 18v9c0 8 7 15 18 15s18-7 18-15v-9c0-10-8-18-18-18Z" fill="none" stroke="#39ff88" stroke-width="2.7"/>
    <path d="M28 34h2M46 34h2M31 48c4 3 10 3 14 0" class="line" stroke="#39ff88" stroke-width="2.7"/>
    <path d="M24 24l-8-7M52 24l8-7" class="line" stroke="#1fcf6a" stroke-width="2"/>
  </g>
  <text x="145" y="181" class="title">Linux</text>
  <text x="145" y="207" class="sub">Systems &amp; Command Line</text>
  <text x="75" y="268" class="small">SYSTEMS</text>

  <!-- Git -->
  <g filter="url(#shadow)">
    <rect x="425" y="120" width="350" height="175" rx="18" class="card"/>
    <rect x="425" y="120" width="350" height="3" rx="1.5" fill="url(#neon)" filter="url(#glow)"/>
  </g>
  <g transform="translate(458 150)">
    <circle cx="38" cy="38" r="31" fill="#071b10" stroke="#247b49"/>
    <path d="M22 25l32 32M54 25L38 41M38 41v18" class="line" stroke="#39ff88" stroke-width="3"/>
    <circle cx="22" cy="25" r="6" fill="#07110c" stroke="#39ff88" stroke-width="2.5"/>
    <circle cx="54" cy="25" r="6" fill="#07110c" stroke="#39ff88" stroke-width="2.5"/>
    <circle cx="38" cy="59" r="6" fill="#07110c" stroke="#39ff88" stroke-width="2.5"/>
  </g>
  <text x="528" y="181" class="title">Git</text>
  <text x="528" y="207" class="sub">Version Control &amp; Workflow</text>
  <text x="458" y="268" class="small">VERSIONING</text>

  <!-- CMake -->
  <g filter="url(#shadow)">
    <rect x="808" y="120" width="350" height="175" rx="18" class="card"/>
    <rect x="808" y="120" width="350" height="3" rx="1.5" fill="url(#neon)" filter="url(#glow)"/>
  </g>
  <g transform="translate(841 150)">
    <circle cx="38" cy="38" r="31" fill="#071b10" stroke="#247b49"/>
    <path d="M38 16l23 44H15z" fill="none" stroke="#39ff88" stroke-width="2.8"/>
    <path d="M38 16v44M25 38h26" class="line" stroke="#39ff88" stroke-width="2.2"/>
    <circle cx="38" cy="39" r="5" fill="#39ff88"/>
  </g>
  <text x="911" y="181" class="title">CMake</text>
  <text x="911" y="207" class="sub">Build Systems &amp; Automation</text>
  <text x="841" y="268" class="small">BUILD</text>

  <!-- Networking -->
  <g filter="url(#shadow)">
    <rect x="42" y="335" width="350" height="175" rx="18" class="card"/>
    <rect x="42" y="335" width="350" height="3" rx="1.5" fill="url(#neon)" filter="url(#glow)"/>
  </g>
  <g transform="translate(75 365)">
    <circle cx="38" cy="38" r="31" fill="#071b10" stroke="#247b49"/>
    <circle cx="21" cy="38" r="5" fill="#39ff88"/>
    <circle cx="55" cy="22" r="5" fill="#39ff88"/>
    <circle cx="55" cy="54" r="5" fill="#39ff88"/>
    <path d="M26 36l24-12M26 40l24 12" class="line" stroke="#39ff88" stroke-width="2.7"/>
    <path d="M20 19c5-7 11-10 18-10s13 3 18 10" class="line" stroke="#1fcf6a" stroke-width="2"/>
    <path d="M20 57c5 7 11 10 18 10s13-3 18-10" class="line" stroke="#1fcf6a" stroke-width="2"/>
  </g>
  <text x="145" y="396" class="title">Networking</text>
  <text x="145" y="422" class="sub">Protocols &amp; Network Systems</text>
  <text x="75" y="483" class="small">NETWORK</text>

  <!-- PostgreSQL -->
  <g filter="url(#shadow)">
    <rect x="425" y="335" width="350" height="175" rx="18" class="card"/>
    <rect x="425" y="335" width="350" height="3" rx="1.5" fill="url(#neon)" filter="url(#glow)"/>
  </g>
  <g transform="translate(458 365)">
    <circle cx="38" cy="38" r="31" fill="#071b10" stroke="#247b49"/>
    <path d="M25 26c0-7 6-11 13-11s13 4 13 11v26c0 6-5 10-11 10h-5c-6 0-10-4-10-10Z" fill="none" stroke="#39ff88" stroke-width="2.8"/>
    <path d="M30 28c3 5 11 6 17 1M38 51c2-4 6-6 12-5" class="line" stroke="#39ff88" stroke-width="2.3"/>
    <circle cx="31" cy="27" r="2" fill="#39ff88"/><circle cx="45" cy="27" r="2" fill="#39ff88"/>
  </g>
  <text x="528" y="396" class="title">PostgreSQL</text>
  <text x="528" y="422" class="sub">Relational Databases &amp; SQL</text>
  <text x="458" y="483" class="small">DATABASE</text>

  <!-- Docker -->
  <g filter="url(#shadow)">
    <rect x="808" y="335" width="350" height="175" rx="18" class="card"/>
    <rect x="808" y="335" width="350" height="3" rx="1.5" fill="url(#neon)" filter="url(#glow)"/>
  </g>
  <g transform="translate(841 365)">
    <circle cx="38" cy="38" r="31" fill="#071b10" stroke="#247b49"/>
    <path d="M21 43h38c-3 10-11 15-23 15-9 0-15-5-15-15Z" fill="none" stroke="#39ff88" stroke-width="2.8"/>
    <path d="M26 39v-8h8v8M36 39v-8h8v8M46 39v-8h8v8M31 29v-8h8v8" fill="none" stroke="#39ff88" stroke-width="2.4"/>
    <path d="M59 43c5-4 9-4 13-2-3 4-7 6-12 6" class="line" stroke="#1fcf6a" stroke-width="2.3"/>
  </g>
  <text x="911" y="396" class="title">Docker</text>
  <text x="911" y="422" class="sub">Containers &amp; Dev Environments</text>
  <text x="841" y="483" class="small">CONTAINERS</text>

  <text x="600" y="542" text-anchor="middle" class="small">[ SECURE • BUILD • DEPLOY ]</text>
</svg>
